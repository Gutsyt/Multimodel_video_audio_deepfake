[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avdd"
version = "1.0.0"
description = "Audio-visual deepfake detection: frozen CLIP / XLS-R features with trained, calibrated heads"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
video = ["opencv-python-headless>=4.9,<5"]
torch = ["torch"]  # install the CPU build; see README
hf = ["transformers>=4.45", "pillow", "safetensors"]
api = ["fastapi", "uvicorn"]
train = ["scikit-learn", "pyarrow", "soundfile", "huggingface_hub", "httpx", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
avdd = ["assets/*.onnx", "assets/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["real_models: runs the real pretrained models (plumbing/plausibility only; skipped when unavailable)"]

[tool.ruff]
line-length = 100
extend-exclude = ["notebooks"]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["uvicorn", "uvicorn.*", "torch", "torch.*", "transformers", "transformers.*", "cv2", "cv2.*", "PIL", "PIL.*", "skimage", "skimage.*", "sklearn", "sklearn.*", "pyarrow", "pyarrow.*", "soundfile", "matplotlib", "matplotlib.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true
